name: Repo Gates

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Repo State Check
        run: powershell -ExecutionPolicy Bypass -File scripts/gates/check_repo_state.ps1

      - name: Run DB Mutation Guard
        run: powershell -ExecutionPolicy Bypass -File scripts/gates/check_db_mutation.ps1

      - name: Git diff check
        run: git diff --check

      - name: G4 Write-Path Guard (C2 — sqlite3.connect AST scan)
        run: python scripts/gates/check_write_guard.py --path backend/app

      - name: G5 Data Hygiene Guard (tracked-vs-gitignored scan)
        run: python scripts/gates/check_data_hygiene.py

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies (pinned, incl. test deps)
        run: pip install -r backend/requirements-dev.lock

      - name: Generate synthetic test database
        run: python scripts/testing/generate_synthetic_test_db.py

      - name: Build anonymous allowlist artifact
        run: python scripts/build_anonymous_allowlist.py --db output/import/production.db --out artifacts/anonymous_allowlist.json

      - name: Run backend test suite
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
