# TEMPORARY one-shot job: regenerate auth goldens on the EXACT release-gate
# toolchain (ubuntu-latest + subosito/flutter-action 3.44.1) so the committed
# PNGs are Linux-truth. Removed after the goldens are committed back.
#
# Issue #81 — auth goldens were generated on Windows (PR #78) and drift
# 0.15-0.47% on the Linux runner (fontconfig vs DirectWrite AA).

name: Golden Regen (temporary)

on:
  push:
    branches: [fix/auth-goldens-linux]

permissions:
  contents: write

defaults:
  run:
    working-directory: frontend

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate auth goldens (Linux truth)
        run: flutter test --update-goldens test/features/auth/auth_screen_golden_test.dart

      - name: Verify goldens pass on this runner
        run: flutter test test/features/auth/auth_screen_golden_test.dart

      - name: Commit regenerated goldens back
        working-directory: ./
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/test/features/auth/goldens
          if git diff --cached --quiet; then
            echo "No golden changes (already Linux-truth)."
          else
            git commit -m "chore(goldens): regenerate auth goldens on Linux CI runner (temporary regen job)"
            git push origin fix/auth-goldens-linux
          fi
