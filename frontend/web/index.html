<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Viski meraklıları için lezzet profilleri — veriyle okunur. 4.700+ viski, damıtım evleri ve bölgeler, kaynaklı kanıtlarla.">
  <meta name="description:en" content="Flavor profiles for whisky enthusiasts — read with data. 4,700+ whiskies, distilleries and regions, with sourced evidence.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Malt Radar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (cache-busted: forces browsers off any stale favicon) -->
  <link rel="icon" type="image/png" href="favicon.png?v=brand1"/>

  <title>Malt Radar</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Consent Mode v2 Default Bootstrap & gtag Initialization -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    // Default consent state: HARD DENIED prior to explicit user choice
    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'wait_for_update': 500
    });

    // Helper for consent state updates via CMP UI
    window.updateGoogleConsent = function(analyticsGranted, marketingGranted) {
      gtag('consent', 'update', {
        'analytics_storage': analyticsGranted ? 'granted' : 'denied',
        'ad_storage': marketingGranted ? 'granted' : 'denied',
        'ad_user_data': marketingGranted ? 'granted' : 'denied',
        'ad_personalization': marketingGranted ? 'granted' : 'denied'
      });
    };
  </script>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4569028808710145"
     crossorigin="anonymous"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Kill any stale Flutter service worker + its caches on every load.
    // The SW was serving an old main.dart.js (2-page pagination) even after redeploys,
    // which manifested as an empty whisky list. Unregister + purge caches so the
    // fresh build is always fetched.
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && window.caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
