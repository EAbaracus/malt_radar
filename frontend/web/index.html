<!DOCTYPE html>
<html>
<head>
  <!--
    Malt Radar — Flutter Web entry point.
    Custom index.html with CanvasKit-to-HTML fallback for WebGL-blocked browsers
    (e.g. Brave strict fingerprint mode, some corporate proxies).

    flutter_bootstrap.js (post-build patched) checks WebGL availability and
    selects the HTML renderer when WebGL is unavailable.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Viski lezzet radarları, notlar ve kişisel koleksiyon yönetimi.">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Malt Radar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon (cache-busted) -->
  <link rel="icon" type="image/png" href="favicon.png?v=brand1"/>

  <title>Malt Radar</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Consent Mode v2 Default Bootstrap & gtag Initialization -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    // Default consent state: HARD DENIED prior to explicit user choice
    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'wait_for_update': 500
    });
    window.updateGoogleConsent = function(analyticsGranted, marketingGranted) {
      gtag('consent', 'update', {
        'analytics_storage': analyticsGranted ? 'granted' : 'denied',
        'ad_storage': marketingGranted ? 'granted' : 'denied',
        'ad_user_data': marketingGranted ? 'granted' : 'denied',
        'ad_personalization': marketingGranted ? 'granted' : 'denied'
      });
    };
  </script>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4569028808710145"
     crossorigin="anonymous"></script>

  <!-- Google Analytics 4 (Consent Mode v2 aware) -->
  <!-- TODO: Replace G-XXXXXXX with real Measurement ID after GA4 property setup -->
  <script>
    // Load GA4 only after consent is updated (analytics_storage !== 'denied')
    // GA4 Measurement Protocol: events sent when consent.granted
    // If consent remains denied, no GA4 data is collected
    window.dataLayer = window.dataLayer || [];
    // gtag config will be initialized after consent update
    window.initGA4 = function(measurementId) {
      if (window.__ga4_initialized) return;
      window.__ga4_initialized = true;
      var gaScript = document.createElement('script');
      gaScript.async = true;
      gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + measurementId;
      document.head.appendChild(gaScript);
      gaScript.onload = function() {
        gtag('js', new Date());
        gtag('config', measurementId, {
          'debug_mode': false,
          'cookie_domain': 'maltradar.com',
          'cookie_expires': 63072000,
          'custom_map': {
            'share_channel': 'share_channel',
            'anon_ref_id': 'anon_ref_id',
            'referral_source': 'referral_source'
          }
        });
        // Dispatch buffered events
        window.dataLayer.forEach(function(item) {
          if (item[0] === 'event') {
            gtag('event', item[1], item[2]);
          }
        });
      };
    };
    // Initialize GA4 when analytics consent granted
    window.updateGoogleConsent = function(analyticsGranted, marketingGranted) {
      gtag('consent', 'update', {
        'analytics_storage': analyticsGranted ? 'granted' : 'denied',
        'ad_storage': marketingGranted ? 'granted' : 'denied',
        'ad_user_data': marketingGranted ? 'granted' : 'denied',
        'ad_personalization': marketingGranted ? 'granted' : 'denied'
      });
      if (analyticsGranted && !window.__ga4_initialized) {
        window.initGA4('G-XXXXXXX');  // Replace with real GA4 Measurement ID
      }
    };
  </script></head>
<body>
  <!--
    Kill any stale Flutter service worker + its caches on every load.
    The SW was serving an old main.dart.js (2-page pagination) even after
    redeploys, which manifested as an empty whisky list. Unregister +
    purge caches so the fresh build is always fetched.
  -->
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches && window.caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
